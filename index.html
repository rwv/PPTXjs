<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>PPTXjs - Meshesha</title>

<script type="module">
	import { ensurePptxDependencies, pptxToHtml } from "./src/pptxjs-entry.ts";

	document.addEventListener("DOMContentLoaded", async function () {
		await ensurePptxDependencies();

		var oldWidth = "";
		var oldMargin = "";
		var fullscreenButton = document.getElementById("fullscreen-btn");
		var result = document.getElementById("result");
		if (!fullscreenButton || !result) {
			return;
		}

		function updateSlideStyles(width, margin) {
			var slide = result.querySelector(".slide");
			if (!slide) {
				return;
			}
			slide.style.width = width;
			slide.style.margin = margin;
		}

		fullscreenButton.addEventListener("click", function () {
			if (!document.fullscreenElement) {
				var slide = result.querySelector(".slide");
				if (slide) {
					var computed = window.getComputedStyle(slide);
					oldWidth = computed.width;
					oldMargin = computed.margin;
				}
				updateSlideStyles("99%", "0 auto");
				if (result.requestFullscreen) {
					result.requestFullscreen();
				}
			} else {
				updateSlideStyles(oldWidth, oldMargin);
				if (document.exitFullscreen) {
					document.exitFullscreen();
				}
			}
		});

		document.addEventListener("fullscreenchange", function () {
			if (!document.fullscreenElement) {
				updateSlideStyles(oldWidth, oldMargin);
			}
		});

		pptxToHtml(result, {
			pptxFileUrl: "Sample_12.pptx",
			fileInputId: "uploadFileInput",
			slideMode: false,
			keyBoardShortCut: false,
			slideModeConfig: {  //on slide mode (slideMode: true)
			    first: 1,
			    nav: false, /** true,false : show or not nav buttons*/
			    navTxtColor: "white", /** color */
			    showPlayPauseBtn: false,/** true,false */
			    keyBoardShortCut: false, /** true,false */
			    showSlideNum: false, /** true,false */
			    showTotalSlideNum: false, /** true,false */
			    autoSlide: false, /** false or seconds (the pause time between slides) , F8 to active(keyBoardShortCut: true) */
			    randomAutoSlide: false, /** true,false ,autoSlide:true */
			    loop: false,  /** true,false */
			    background: "black", /** false or color*/
			    transition: "default", /** transition type: "slid","fade","default","random" , to show transition efects :transitionTime > 0.5 */
			    transitionTime: 1 /** transition time in seconds */
			}
		});
	});
</script>
<style>
	html, body { margin: 0; padding: 0; }
	#warper { margin-right: auto; margin-left: auto; width: 900px; }
</style>
</head>
<body>
	<div id="warper">
		<input id="uploadFileInput" type="file" />
		<br><br>
		<div id="container">
			<input id="fullscreen-btn" type="button" value="Fullscreen" />
			<br>
			<div  id="result"></div>
		</div>
	</div>
</body>
</html>
